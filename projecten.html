<!DOCTYPE html>
<html lang="en">
<head>
<title>My Work | JadenJelier</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Projects Jaden has built as a software engineering student.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-md bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand logo" href="index.html">JadenJelier</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu" aria-label="Open menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navmenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa fa-user"></i> WhoAmI</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="projecten.html"><i class="fa fa-th"></i> My Work</a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html"><i class="fa fa-pencil"></i> Blog</a></li>
        <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#modalContact"><i class="fa fa-envelope"></i> Contact</button></li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <section class="py-5 bg-light">
    <div class="container py-5">
      <h1 class="h2 text-center">My Projects</h1>
      <p class="text-center fs-5">Some of what I've made so far</p>
      <div class="row g-3 mt-4 justify-content-center">
        <div class="col-md-4">
          <label for="categoryFilter" class="form-label">Category</label>
          <select id="categoryFilter" class="form-select">
            <option value="all">All projects</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="sortOrder" class="form-label">Sort by</label>
          <select id="sortOrder" class="form-select">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="title">Title A to Z</option>
          </select>
        </div>
      </div>
      <p id="projectCount" class="text-center mt-4 mb-0" aria-live="polite"></p>
      <div id="projectList" class="row g-4 mt-2"></div>
      <noscript><p class="text-center">Turn on JavaScript to see my projects.</p></noscript>
    </div>
  </section>
</main>

<div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header border-0">
        <h2 class="modal-title fs-4" id="projectModalTitle"></h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <img id="projectModalImage" class="img-fluid" alt="">
      <div class="modal-body text-center" id="projectModalText"></div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center py-5">
  <a href="#top" class="btn btn-light"><i class="fa fa-arrow-up me-2"></i>To the top</a>
  <div class="fs-3 mt-4">
    <a href="https://github.com/Jaden404" class="social-link me-2" aria-label="GitHub" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i></a>
    <a href="https://www.linkedin.com/in/JadenJelier" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><i class="fa fa-linkedin"></i></a>
  </div>
</footer>

<div class="modal fade" id="modalContact" tabindex="-1" aria-labelledby="contactTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white" data-bs-theme="dark">
      <div class="modal-header border-0">
        <h2 class="modal-title fs-4" id="contactTitle">Contact me</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="contactForm" novalidate>
          <div class="mb-3">
            <label for="contactName" class="form-label">Name</label>
            <input type="text" class="form-control" id="contactName" autocomplete="name" required aria-describedby="contactNameError">
            <div class="invalid-feedback" id="contactNameError"></div>
          </div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="contactEmail" autocomplete="email" required aria-describedby="contactEmailError">
            <div class="invalid-feedback" id="contactEmailError"></div>
          </div>
          <div class="mb-3">
            <label for="contactMessage" class="form-label">Message</label>
            <textarea class="form-control" id="contactMessage" rows="5" required aria-describedby="contactMessageError"></textarea>
            <div class="invalid-feedback" id="contactMessageError"></div>
          </div>
          <button type="submit" class="btn btn-light w-100">Send</button>
        </form>
        <div id="formStatus" class="mt-3" role="status"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="contact.js"></script>
<script src="projects.js"></script>

</body>
</html>
