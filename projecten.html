<main>
  <section class="section section-light">
    <div class="wrapper">
      <h1 class="section-title">My Projects</h1>
      <p class="section-intro">Some of what I've made so far</p>
      <div class="filters">
        <div>
          <label for="categoryFilter" class="form-label">Category</label>
          <select id="categoryFilter" class="form-select">
            <option value="all">All projects</option>
          </select>
        </div>
        <div>
          <label for="sortOrder" class="form-label">Sort by</label>
          <select id="sortOrder" class="form-select">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="title">Title A to Z</option>
          </select>
        </div>
      </div>
      <p id="projectCount" class="project-count" aria-live="polite"></p>
      <div id="projectList" class="project-grid"></div>
      <noscript><p class="section-intro">Turn on JavaScript to see my projects.</p></noscript>
    </div>
  </section>
</main>

      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle"></h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <img id="projectModalImage" class="modal-image" alt="">
      <div class="modal-body project-modal-text" id="projectModalText"></div>
